<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>深海余烬与流光水母 · Zone 1</title>
<style>
  :root {
    --abyss:      #0B1026;
    --deep:       #1B2A4A;
    --slate:      #25355F;
    --biolum:     #70FFE0;
    --biolum-dim: #31D6C8;
    --rust:       #D8792D;
    --alert:      #FF3344;
    --bone:       #DFFFF7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--abyss);
    color: var(--bone);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    overscroll-behavior: none;
  }

  #app {
    display: grid;
    grid-template-columns: 1fr 320px;
    height: 100%;
  }

  #game {
    position: relative;
    overflow: hidden;
    /* 深海渐层，越往下越暗 */
    background: linear-gradient(180deg, var(--deep) 0%, var(--abyss) 70%);
  }
  #game canvas { display: block; image-rendering: pixelated; }

  #panel {
    border-left: 1px solid var(--slate);
    background: color-mix(in srgb, var(--abyss) 88%, black);
    overflow-y: auto;
    padding: 16px 14px 40px;
  }

  #panel h1 {
    margin: 0 0 2px;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--biolum);
  }
  #panel .sub {
    margin: 0 0 18px;
    font-size: 11px;
    line-height: 1.5;
    color: color-mix(in srgb, var(--bone) 45%, transparent);
  }

  .group { margin-bottom: 18px; }
  .group > .group-title {
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--rust);
    padding-bottom: 5px;
    margin-bottom: 9px;
    border-bottom: 1px solid color-mix(in srgb, var(--rust) 30%, transparent);
  }

  .row { margin-bottom: 11px; }
  .row .label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .row .label .name { color: color-mix(in srgb, var(--bone) 72%, transparent); }
  .row .label .value { color: var(--biolum); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--slate);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    background: var(--biolum);
    cursor: ew-resize;
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px; border: 0;
    background: var(--biolum);
    cursor: ew-resize;
  }
  input[type="range"]:focus-visible { outline: 1px solid var(--biolum); outline-offset: 4px; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    padding: 5px 0;
    cursor: pointer;
    color: color-mix(in srgb, var(--bone) 72%, transparent);
  }
  .toggle input { accent-color: var(--biolum); margin: 0; }

  #readout {
    font-size: 11px;
    line-height: 1.7;
    color: color-mix(in srgb, var(--bone) 60%, transparent);
  }
  #readout b { color: var(--biolum); font-weight: 400; font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions button {
    flex: 1;
    padding: 7px 4px;
    font: inherit;
    font-size: 11px;
    color: var(--bone);
    background: transparent;
    border: 1px solid var(--slate);
    cursor: pointer;
  }
  .actions button:hover { border-color: var(--biolum); color: var(--biolum); }

  .note {
    font-size: 10px;
    line-height: 1.6;
    color: color-mix(in srgb, var(--alert) 70%, var(--bone));
    border-left: 2px solid var(--alert);
    padding-left: 8px;
    margin-top: 14px;
  }

  #hint {
    position: absolute;
    left: 14px; bottom: 12px;
    font-size: 11px;
    line-height: 1.6;
    color: color-mix(in srgb, var(--bone) 38%, transparent);
    pointer-events: none;
  }
  #hint kbd {
    color: var(--biolum-dim);
    font: inherit;
    border: 1px solid color-mix(in srgb, var(--biolum) 25%, transparent);
    padding: 0 4px;
  }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #panel { border-left: 0; border-top: 1px solid var(--slate); max-height: 45vh; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="game">

    </div>
    <aside id="panel">
      <h1>调参台</h1>
      <p class="sub">改动即时生效。调到满意后点「导出 JSON」，粘回 <code>src/config/tuning.ts</code> 的 <code>DEFAULT_TUNING</code>。</p>
      <div id="controls"></div>
    </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
